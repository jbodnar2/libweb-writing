extends: existence
message: "GSU Social Branding: Use official CamelCase format (e.g., '#TheStateWay', '#GoState')."
level: warning
ignorecase: false
tokens:
  # Flag lowercase versions of official tags
  - "#thestateway"
  - "#gostate"
  - "#stateathletics"
  - "#gsulife"
  - "#gsualumni"
  - "#gsufuture"

  # Flag hyphenated or underscored versions
  - "#the-state-way"
  - "#go-state"
  - "#state-athletics"
  - "#gsu-life"

  # Flag weird capitalization (e.g., #TheStateWAY)
  - "#[A-Z][a-z]+[A-Z]{2,}"
