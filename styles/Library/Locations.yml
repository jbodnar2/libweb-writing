extends: existence
message: "Atlanta quadrant missing. Use NE, SE, NW, or SW (no periods)."
level: error
tokens:
  - '\d+ [A-Za-z ]+ (St|Ave|Blvd|Dr|Street|Avenue|Boulevard|Drive)(?! (NE|SE|NW|SW))'
---
extends: existence
message: "Use full street types in addresses (Street, Avenue, Boulevard, Drive)."
level: warning
tokens:
  - '\d+ [A-Za-z ]+ (St\.?|Ave\.?|Blvd\.?|Dr\.?)\b'
---
extends: existence
message: "Use directionals without periods (SE, not S.E.)."
level: warning
tokens:
  - '\b(N\.?E\.?|S\.?E\.?|N\.?W\.?|S\.?W\.?)\b'
---
extends: substitution
message: "Library Style: Use '%s' for specific buildings/addresses."
level: warning
ignorecase: true
swap:
  Welch Gallery: Ernest G. Welch School of Art & Design Gallery
  One Park Place: 1 Park Place SE
  Speakers Auditorium: Speaker’s Auditorium
  103 Decatur St\.?\s*S\.?E\.?\b: 100 Decatur Street SE
  103 Decatur Street: 100 Decatur Street SE
