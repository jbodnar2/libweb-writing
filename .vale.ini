StylesPath = ./styles
MinAlertLevel = suggestion

[*.{md,docx,txt}]
BasedOnStyles = GradeLevel, ReadingEase, Structure

output = review.tmpl

Vocab = LibraryUnitsAndDepartments, LibraryToolsAndResources, UniversityAndAcademicTerms, PeopleNames, PlacesBuildingsAndAddresses, WritingQualityAndStyleTerms
# Important: do not add "GSU" or other acronyms to accepted vocabulary; it suppresses acronym checks.


# ---------------------------------------------------------
# Page-Level Checks
# ---------------------------------------------------------

# Readability
# --------------------------------------------------------
ReadingEase.Easy = YES
ReadingEase.Moderate = YES
ReadingEase.Low = YES

# Grade Level
# --------------------------------------------------------
GradeLevel.Academic = YES
GradeLevel.Accessible = YES
GradeLevel.Complex = YES
GradeLevel.Difficult = YES

# Structure
# --------------------------------------------------------
Structure.SentenceLength = YES
Structure.ParagraphLength = YES
