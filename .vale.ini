StylesPath = styles
MinAlertLevel = suggestion

Packages = Microsoft, Joblint, alex, write-good, proselint
Vocab = LibraryUnitsAndDepartments, LibraryToolsAndResources, UniversityAndAcademicTerms, PeopleNames, PlacesBuildingsAndAddresses

[*.{md,docx,html,txt}]
BasedOnStyles = Vale, Microsoft, write-good, alex, Joblint, proselint, GSU, Library

# Ensure the new rule is active
GSU.IdentityOccurrence = YES

# Keep entity-level capitalization checks active.
IgnoredPhrases =

# ---------------------------------------------------------
# Rule Adjustments and Overrides
# ---------------------------------------------------------

# --- BRAND & VOICE ALIGNMENT ---
# GSU prefers a conversational tone (we/us/our) and contractions.
Microsoft.FirstPerson = NO
Microsoft.We = NO
Microsoft.Contractions = NO

# Stop generic wordiness rules from double-flagging utilize
Microsoft.Wordiness = NO
write-good.TooWordy = NO

# GSU/Library Style excludes the Oxford Comma and allows ampersands.
Microsoft.OxfordComma = NO
Microsoft.Ampersand = NO
Microsoft.HeadingPunctuation = NO
Microsoft.SentenceLength = NO

# GSU requires lowercase a.m./p.m. vs Microsoft's uppercase AM/PM.
Microsoft.AMPM = NO
Microsoft.Dashes = NO

# --- TECHNICAL & DOCUMENTATION STANDARDS ---
# Standardize heading and acronym handling for web documentation.
Microsoft.Acronyms = NO
Microsoft.Headings = NO
Microsoft.HeadingAcronyms = NO

# Date/time formatting is handled by project-specific library rules.
proselint.DateCase = NO
proselint.DateSpacing = NO
proselint.DateMidnight = NO

# E-Prime is disabled to allow the use of "to be" verbs.
write-good.E-Prime = NO

# --- READABILITY & PASSIVE VOICE ---
# Passive voice is necessary for location and service descriptions.
write-good.Passive = NO
Microsoft.Passive = NO
write-good.ThereIs = NO

# --- INCLUSIVE LANGUAGE & BIAS ---
# The following rules remain active to catch general bias.
# Specific academic exceptions will be handled in the vocabulary accept.txt.
#
# Microsoft.GenderBias
# proselint.GenderBias
# alex.Gendered
# alex.Ablist
# alex.Condescending
# alex.Race
# alex.ProfanityUnlikely

# Silence generic gender/bias rules to let GSU.Identity take priority
alex.Gendered = NO
Microsoft.GenderBias = NO
proselint.GenderBias = NO
alex.ProfanityUnlikely = NO
write-good.Weasel = NO

# Clean up remaining Microsoft vocabulary/punctuation noise
Microsoft.Vocab = NO
Microsoft.Semicolon = NO

# Keep review output focused on actionable corrections.
GSU.Social = NO

Vale.Terms = NO
